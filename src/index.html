<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ledgerly</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Angular enterprise showcase: a fictional B2B banking dashboard built with Angular 22, signals, zoneless change detection, Signal Forms, runtime EN/PT-BR i18n and WCAG 2.2 AA accessibility."
    />
    <link rel="canonical" href="https://ledgerly-eda.pages.dev/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Link previews (LinkedIn, Slack, X...). Crawlers don't run JS, so these must be static. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ledgerly" />
    <meta property="og:title" content="Ledgerly · Angular enterprise showcase" />
    <meta
      property="og:description"
      content="A B2B banking dashboard in Angular 22: signals, zoneless, Signal Forms, runtime EN/PT-BR and WCAG 2.2 AA checked by Playwright + axe in CI."
    />
    <meta property="og:url" content="https://ledgerly-eda.pages.dev/" />
    <meta property="og:image" content="https://ledgerly-eda.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta
      property="og:image:alt"
      content="Ledgerly dashboard with KPI tiles and a cash flow chart"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the theme before first paint to avoid a light flash in dark mode.
      // Keep in sync with ThemeService (storage key + class name).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('ledgerly.theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <app-root></app-root>
  </body>
</html>
