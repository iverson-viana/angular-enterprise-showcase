<a
  href="#main-content"
  (click)="skipToMain($event)"
  class="sr-only z-50 rounded-md bg-blue-700 px-4 py-2 font-medium text-white focus:not-sr-only focus:fixed focus:top-3 focus:left-3"
>
  Skip to main content
</a>

<div class="flex min-h-dvh">
  <!-- Desktop sidebar -->
  <aside
    class="hidden border-r border-slate-200 bg-white lg:fixed lg:inset-y-0 lg:flex lg:w-64 lg:flex-col dark:border-slate-800 dark:bg-slate-900"
  >
    <div class="flex h-16 items-center px-6">
      <span class="text-lg font-semibold tracking-tight text-slate-900 dark:text-white">
        Ledgerly
      </span>
    </div>
    <div class="flex-1 overflow-y-auto px-3 py-4">
      <app-sidebar-nav />
    </div>
  </aside>

  <!-- Mobile drawer -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- (click) is a mouse-only backdrop light-dismiss; keyboard users close the native <dialog> with Esc or the close button. -->
  <dialog
    #drawer
    aria-label="Navigation"
    (click)="onDrawerClick($event)"
    class="m-0 h-dvh max-h-none w-72 max-w-[85vw] bg-white p-0 backdrop:bg-slate-900/60 dark:bg-slate-900"
  >
    <div class="flex h-16 items-center justify-between px-6">
      <span class="text-lg font-semibold tracking-tight text-slate-900 dark:text-white">
        Ledgerly
      </span>
      <button
        type="button"
        aria-label="Close navigation"
        (click)="closeDrawer()"
        class="-mr-2 inline-flex size-10 items-center justify-center rounded-md text-slate-600 hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-blue-700 focus-visible:outline-none dark:text-slate-300 dark:hover:bg-slate-800"
      >
        <app-icon name="close" />
      </button>
    </div>
    <div class="px-3 py-4">
      <app-sidebar-nav />
    </div>
  </dialog>

  <div class="flex min-w-0 flex-1 flex-col lg:pl-64">
    <app-topbar (menuClick)="openDrawer()" />
    <main
      #main
      id="main-content"
      tabindex="-1"
      class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 focus:outline-none sm:px-6 lg:px-8"
    >
      <router-outlet />
    </main>
  </div>
</div>
